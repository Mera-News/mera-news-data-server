name: Self-hosting guide

# Follows docs/self-host.md in a fresh environment. It runs only when the guide,
# its settings example, the runner or this file change, or by hand: it takes a
# few minutes and builds two search indexes.
on:
  push:
    paths:
      - docs/self-host.md
      - .env.example
      - test/e2e/selfhost/**
      - .github/workflows/selfhost.yml
  workflow_dispatch:

jobs:
  # Follows docs/self-host.md step by step, then checks what it built.
  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8@sha256:034530eef78a0631c35f07e1a7244429d5c7b8cb96aefb52155b8a76047816cc
        env:
          DO_NOT_TRACK: "1"
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/mera-news?directConnection=true
      SELFHOST_LOG_DIR: /tmp/selfhost-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the runner and the guide
        run: |
          node --test test/e2e/selfhost/*.test.mjs
          node test/e2e/selfhost/run-docs.mjs docs/self-host.md --lint
      - name: Start the stand-ins
        run: |
          mkdir -p "$SELFHOST_LOG_DIR"
          nohup node test/e2e/selfhost/fake-embeddings.mjs > "$SELFHOST_LOG_DIR/fake-embeddings.log" 2>&1 &
          echo $! >> "$SELFHOST_LOG_DIR/stand-ins.pids"
          nohup node test/e2e/selfhost/fixture-publisher.mjs > "$SELFHOST_LOG_DIR/fixture-publisher.log" 2>&1 &
          echo $! >> "$SELFHOST_LOG_DIR/stand-ins.pids"
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/__hits
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:11434/v1/embeddings -H "content-type: application/json" -d '{"model": "nomic-embed-text", "input": "ping"}' -o /dev/null
      - name: Follow the guide
        run: node test/e2e/selfhost/run-docs.mjs docs/self-host.md
      - name: Check what it built
        env:
          SELFHOST_E2E: "true"
        run: npm run test:e2e -- --testPathPatterns selfhost
      # Step 20 of the guide: switch the news API to a key, restart it, then run a pod against it.
      # The pod repository is public, so it is cloned over https with no key.
      - name: Run a pod against it
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          sed -i 's/^NEWS_API_OPEN=true$/NEWS_API_OPEN=false/' .env
          grep -qx 'NEWS_API_OPEN=false' .env
          printf 'MERA_NEWS_API_KEY=%s\n' "$key" >> .env
          pkill -f dist/apps/mera-server-news-api/main.js
          while pgrep -f dist/apps/mera-server-news-api/main.js > /dev/null; do sleep 1; done
          nohup node dist/apps/mera-server-news-api/main.js > "$SELFHOST_LOG_DIR/news-api-with-key.log" 2>&1 &
          echo $! >> "$SELFHOST_LOG_DIR/pod.pids"
          until curl -fsS http://127.0.0.1:3002/health/ready > /dev/null; do sleep 2; done
          # Without the key the news API now refuses.
          curl -fsS http://127.0.0.1:3002/graphql -H "content-type: application/json" \
            -d '{"query": "{ topHeadlinesForCountry(countryCode: \"GBR\", first: 1) { headlines { clusterSize } } }"}' \
            | grep -q UNAUTHENTICATED
          git clone https://github.com/Mera-News/mera-news-pod "$RUNNER_TEMP/mera-news-pod"
          cd "$RUNNER_TEMP/mera-news-pod"
          npm ci
          npm run build
          MERA_POD_DATA_API_KEY="$key" node scripts/first-picks.mjs --data-server http://127.0.0.1:3002 \
            --fact "I live in Brightwater and follow its new electric buses." --timeout 900
      - name: Show the logs and stop the services
        if: always()
        run: |
          for f in "$SELFHOST_LOG_DIR"/*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          for p in $(cat "$SELFHOST_LOG_DIR"/*.pids 2>/dev/null); do
            kill -- "-$p" 2>/dev/null || kill "$p" 2>/dev/null || true
          done
