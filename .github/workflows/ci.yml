name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-licenses.test.mjs
      - name: Dependency licences
        run: node scripts/check-licenses.mjs
      # mongod binary for the in-memory replica set (version pinned in test/harness/global-setup.ts)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.2.6-${{ runner.os }}
      - run: npm test
      - run: npm run test:integration -- --maxWorkers=2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:async
      - run: npm run build:scripts
      - run: npm run build:news-api
      - run: npm run boot-smoke

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8
        env:
          DO_NOT_TRACK: "1"
        ports:
          - 27017:27017
        # No health-cmd: the image ships its own HEALTHCHECK, which the runner
        # waits on before the steps start.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017/e2e?directConnection=true
      REDIS_URL: redis://localhost:6379
      PERSISTENT_REDIS_URL: redis://localhost:6379
      MERA_SERVER_ASYNC_API_KEY: e2e-local-key
      EMBEDDING_PROVIDER: fake
      TRANSLATION_PROVIDER: fake
      ARTICLE_ENRICHMENT_PROVIDER: fake
      # The fakes are refused under NODE_ENV=production without this.
      ALLOW_FAKE_PROVIDERS: "true"
      HTTP_UPGRADE_PROBE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:async
      - run: npm run build:news-api
      # Names the egress tests resolve to loopback, which the fetcher must refuse.
      - name: Map fixture hosts to loopback
        run: echo "127.0.0.1 private-feed.example.test lan-feed.example.test" | sudo tee -a /etc/hosts
      # A throwaway certificate for the https fixture server, trusted by Node.
      - name: Create fixture certificate
        run: |
          dir="$RUNNER_TEMP/e2e-tls"
          mkdir -p "$dir"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -keyout "$dir/key.pem" -out "$dir/cert.pem" -subj /CN=127.0.0.1 \
            -addext "subjectAltName=IP:127.0.0.1"
          echo "E2E_TLS_DIR=$dir" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$dir/cert.pem" >> "$GITHUB_ENV"
      - run: npm run test:e2e
